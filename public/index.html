<!DOCTYPE html>
<html lang="fr">

<head>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921222.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloudSecureIT - Upload a document</title>
    <style>
     body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  margin: 0;
}

.container {
  max-width: 600px;
  margin: 60px auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  font-weight: bold;
  display: block;
  margin-top: 15px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: #0078d4;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #005fa3;
}


.secure-link {
  color: #0078d4;
  font-weight: bold;
  text-decoration: none;
}

.secure-link:hover {
  text-decoration: underline;
}

.success {
  margin-top: 20px;
  padding: 20px;
  background: #eaf4ff;
  border-left: 5px solid #0078d4;
  border-radius: 8px;
  word-wrap: break-word;
}

    </style>
</head>

<body>
    <div class="container">
        <h1>CloudSecureIT - Secure Document Upload</h1>
        <p class="subtitle">Upload and securely store your documents in the cloud</p>

        <form id="uploadForm">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required />

            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required />

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />

            <label for="documentType">Document Type</label>
            <select id="documentType" name="documentType" required>
                <option value="">-- Select --</option>
                <option value="CV">CV</option>
                <option value="Projet">Project</option>
                <option value="Profil">Profile</option>
                <option value="Script">Script</option>
            </select>

            <label for="file">File Upload</label>
            <input type="file" id="file" name="file" required />

            <button type="submit">Submit</button>
        </form>

        <div id="result"></div>
        <div id="error"></div>
    </div>

    <script>
        const form = document.getElementById("uploadForm");
        const resultDiv = document.getElementById("result");
        const errorDiv = document.getElementById("error");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            resultDiv.style.display = "none";
            errorDiv.style.display = "none";

            const formData = new FormData();

            formData.append("firstName", document.getElementById("firstName").value);
            formData.append("lastName", document.getElementById("lastName").value);
            formData.append("email", document.getElementById("email").value);
            formData.append("documentType", document.getElementById("documentType").value);
            formData.append("file", document.getElementById("file").files[0]);

            try {
                const response = await fetch("http://localhost:3000/upload", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Upload failed");
                }

                resultDiv.style.display = "block";
   resultDiv.innerHTML = `
  <div class="success">
    <h2>Upload Successful</h2>
    <p><strong>First Name:</strong> ${data.user.firstName}</p>
    <p><strong>Last Name:</strong> ${data.user.lastName}</p>
    <p><strong>Email:</strong> ${data.user.email}</p>
    <p><strong>Document Type:</strong> ${data.user.documentType}</p>
    <p><strong>File Name:</strong> ${data.fileName}</p>
    <p><strong>Secure Link:</strong> 
      <a class="secure-link" href="${data.fileUrl}" target="_blank">Access your document</a>
    </p>
  </div>
`;

                form.reset();
            } catch (error) {
                errorDiv.style.display = "block";
                errorDiv.textContent = error.message;
            }
        });
    </script>
</body>

</html>
